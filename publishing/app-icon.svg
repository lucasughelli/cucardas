<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cucardas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b4eff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Etiqueta / cucarda -->
  <g filter="url(#shadow)">
    <path d="M196 132 H372 a24 24 0 0 1 24 24 V300 a24 24 0 0 1 -7 17 L271 435 a24 24 0 0 1 -34 0 L119 317 a24 24 0 0 1 0 -34 L237 165 a24 24 0 0 1 17 -7 Z"
          transform="translate(-8 -8)" fill="#ffffff"/>
  </g>

  <!-- Agujero de la etiqueta -->
  <circle cx="316" cy="196" r="22" fill="#6b4eff"/>

  <!-- Símbolo de porcentaje estilizado -->
  <g transform="translate(150 250) rotate(-45)" stroke="#6b4eff" stroke-width="22" stroke-linecap="round">
    <circle cx="-2" cy="-2" r="14" fill="none"/>
    <circle cx="70" cy="70" r="14" fill="none"/>
    <line x1="-8" y1="78" x2="76" y2="-10"/>
  </g>
</svg>
